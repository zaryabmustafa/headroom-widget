name: Release

# Push a tag like v0.1.2 to build, test and publish headroom.exe.
# Run it by hand (Actions → Release → Run workflow) for a dry run: build + test,
# exe kept as a workflow artifact, nothing published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - run: cargo test --locked
      - run: cargo build --release --locked

      - name: Installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { exit 1 } }
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & $iscc /Q "/DAppVersion=$v" installer\headroom.iss
          if ($LASTEXITCODE) { exit 1 }

      - name: Checksum
        id: sum
        run: |
          $e = (Get-FileHash target\release\headroom.exe -Algorithm SHA256).Hash
          $s = (Get-FileHash target\installer\headroom-setup.exe -Algorithm SHA256).Hash
          $notes = "SHA-256:`n- ``headroom-setup.exe``: ``$s```n- ``headroom.exe``: ``$e``"
          "notes<<EOF`n$notes`nEOF" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v6
        with:
          name: headroom
          path: |
            target/release/headroom.exe
            target/installer/headroom-setup.exe

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ steps.sum.outputs.notes }}
        run: |
          # A release written by hand keeps its notes; the files are (re)attached.
          $files = 'target/installer/headroom-setup.exe', 'target/release/headroom.exe'
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
          } else {
            gh release create $env:TAG @files --title "Headroom $env:TAG" --generate-notes --notes $env:NOTES
          }
