[package]
name = "headroom"
version = "0.1.8"
description = "Claude Code and Codex usage limits, plus RAM, in the Windows 11 taskbar"
authors = ["Zaryab Mustafa"]
license = "MIT"
edition = "2021"

[dependencies]
serde_json = "1.0.154"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Networking_WinHttp", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_Globalization", "Win32_System_Time", "Win32_Security", "Win32_System_Com", "Win32_UI_Shell_Common"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3.0.12"
