  <rect x="0.25" y="0.25" width="15.5" height="15.5" rx="3.25" fill="none" stroke="#57534E" stroke-width="0.5"/>
  <rect x="3" y="3" width="10" height="1" rx="0.5" fill="#FAFAF9"/>
  <rect x="3" y="9" width="2" height="4" rx="0.4" fill="#F59E0B"/>
  <rect x="7" y="6" width="2" height="7" rx="0.4" fill="#F59E0B"/>
  <rect x="11" y="8" width="2" height="5" rx="0.4" fill="#F59E0B"/>
</svg>
